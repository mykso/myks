name: 'job-lint'

'on':
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    # Type-checking the dependency tree is CPU-bound; ubuntu-slim has a single vCPU.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # issues.new-from-rev in .golangci.yml needs the history.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A key distinct from job-test's, so this job never saves a cache without
          # the race-instrumented build artifacts that job-test relies on.
          cache-dependency-path: |
            go.sum
            .golangci.yml

      - name: Install mise
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # The version is pinned in .mise.toml.
          install-mode: none
