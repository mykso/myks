name: flow-pr

'on': pull_request

jobs:
  lint:
    uses: ./.github/workflows/job-lint.yml
  test:
    uses: ./.github/workflows/job-test.yml
  docker:
    uses: ./.github/workflows/job-docker.yml

  autofix:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # use more powerful token to trigger subsequent workflows
          token: ${{ secrets.MYKSO_BOT_GITHUB_TOKEN }}

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update nix flake
        run: nix run '.#nix-update' -- --flake myks --version=skip

      # Lives in this job, not its own, so both fixes land in one commit: two
      # jobs pushing to the same branch would race.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Regenerate CLI reference
        run: nix shell nixpkgs#go-task -c task docs:refgen

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.MYKSO_BOT_GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Commit changes
        id: commit
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: 'chore: regenerate nix hash and CLI reference'
          commit_user_name: Mykso Bot
          commit_user_email: 135390787+mykso-bot@users.noreply.github.com

      - name: Set commit status
        # When running on a PR, set the commit status on the latest commit in
        # the branch. Otherwise, the PR will be waiting for the commit status
        # indefinitely. This, in particular, blocks Renovate from merging PRs
        # automatically.
        # If running on a push, set the commit status on the current commit.
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.commit.outputs.commit_hash || github.event.pull_request.head.sha || github.sha }}
          DESCRIPTION: ${{ steps.commit.outputs.changes_detected == 'true' && 'New changes have been committed' || 'Flake and CLI reference are up to date' }}
        run: |
          gh api repos/${{ github.repository }}/statuses/"$COMMIT_SHA" \
            -f state=success \
            -f context=autofix \
            -f "description=$DESCRIPTION"
