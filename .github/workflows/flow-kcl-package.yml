name: flow-kcl-package

# Publishes the myks KCL schema package (kcl/myks) to the OCI registry.
# The tag is the version in kcl/myks/kcl.mod. Bump it for every package change.
'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - kcl/myks/kcl.mod

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Publish KCL package
        env:
          # The CLI is released in lockstep with kcl-lang.io/kcl-go, so renovate
          # tracks that module and bumps both in one PR.
          # renovate: datasource=go depName=kcl-lang.io/kcl-go
          KCL_CLI_VERSION: v0.12.5
          KCL_PKG_PATH: ${{ runner.temp }}/kcl-pkg
        run: |
          go install kcl-lang.io/cli/cmd/kcl@$KCL_CLI_VERSION

          # `kcl registry login` refuses to store credentials on a runner with no
          # docker credential helper (oras-go disables plaintext Put by default).
          # kpm reads $KCL_PKG_PATH/.kpm/config/config.json for OCI auth with no
          # such restriction, so write it directly instead of logging in.
          mkdir -p "$KCL_PKG_PATH/.kpm/config"
          auth=$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64 -w0)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" \
            > "$KCL_PKG_PATH/.kpm/config/config.json"

          cd kcl/myks
          kcl mod push oci://ghcr.io/mykso/myks
