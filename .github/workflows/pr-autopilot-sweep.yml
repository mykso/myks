# Scheduled and manual sweeps of Renovate pull requests against .github/pr-autopilot.toml.
# The token comes from octo-sts at sts.zebradil.dev (trust policy in mykso/.github), so the
# repository carries no secret; see pr-autopilot docs/manual.md, "octo-sts".
name: pr-autopilot sweep

'on':
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show verdicts without acting
        type: boolean
        default: false

permissions:
  id-token: write

concurrency:
  group: pr-autopilot-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-slim
    steps:
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: sts
        with:
          domain: sts.zebradil.dev
          scope: ${{ github.repository_owner }}
          identity: pr-autopilot
      - uses: Zebradil/pr-autopilot@72c127fbe12993ba1914831c31113e860c09f48d # v1.5.0
        with:
          dry-run: ${{ inputs.dry_run || false }}
          token: ${{ steps.sts.outputs.token }}
