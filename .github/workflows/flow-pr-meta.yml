---
name: flow-pr-meta

'on':
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  validate-title:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        id: lint_pr_title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fork pull requests get a read-only token: their comment steps fail, the checks still count.
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        continue-on-error: true
        # When the previous steps fails, the workflow would stop. By adding this
        # condition you can continue the execution with the populated error message.
        if: always() && (steps.lint_pr_title.outputs.error_message != null)
        with:
          header: pr-title-lint-error
          message: |
            Hey there and thank you for opening this pull request! 👋🏼

            We require pull request titles to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/) and it looks like your proposed title needs to be adjusted.

            Details:

            ```
            ${{ steps.lint_pr_title.outputs.error_message }}
            ```

      # Delete a previous comment when the issue has been resolved
      - if: ${{ steps.lint_pr_title.outputs.error_message == null }}
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-title-lint-error
          delete: true

  release-note:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check the release note
        id: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          go build -o "$RUNNER_TEMP/release-highlights" ./tools/release-highlights
          if ! "$RUNNER_TEMP/release-highlights" check 2>"$RUNNER_TEMP/problem"; then
            echo "problem=$(sed 's/^release-highlights: //' "$RUNNER_TEMP/problem")" >>"$GITHUB_OUTPUT"
            exit 1
          fi

      - if: always() && steps.check.outputs.problem != ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: release-note-error
          message: |
            `feat`, `fix` and `perf` pull requests need a release note: ${{ steps.check.outputs.problem }}.

            Add a `## Release note` section to the description, as in the [pull request template](https://github.com/mykso/myks/blob/main/.github/pull_request_template.md). It becomes part of the highlights of the next release.

      - if: steps.check.outputs.problem == ''
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: release-note-error
          delete: true
