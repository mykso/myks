---
name: Release highlights

# Rewrites the "Highlights" of the open release-please pull request from the "## Release note"
# sections of the pull requests it releases. release-please rewrites its pull request body on every
# push to main, so this runs after each of those. A release note or "highlight" label changed after
# merge shows up on the next push to main, or at once through workflow_dispatch.
'on':
  workflow_run:
    workflows: [Release Please and GoReleaser]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: release-highlights
  cancel-in-progress: false

permissions: {}

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # workflow_dispatch may name another ref; the highlights are always built by main's tool.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Apply the highlights
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./tools/release-highlights apply
