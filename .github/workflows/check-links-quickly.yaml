---
name: Check Links Quickly

'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/check-links-quickly.yaml
      - docs/**.md
      - README.md
      - CONTRIBUTING.md
  pull_request:
    paths:
      - .github/workflows/check-links-quickly.yaml
      - docs/**.md
      - README.md
      - CONTRIBUTING.md

jobs:
  linkChecker:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore lychee cache
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          # The remaps check docs-site links against this checkout, so a link to a page or file
          # added in the same change passes before it is deployed: site-relative links between
          # pages (../../guides/helm/), the site URL, and blob/tree URLs of this repository on main.
          args: >-
            --root-dir $PWD
            --verbose
            --no-progress
            --cache
            --max-cache-age 3d
            --remap '^file://(.*)/docs/src/content/((getting-started|guides|concepts|reference)[^#]*?)/?(#.*)?$ file://$1/docs/src/content/docs/$2.md'
            --remap '^https://mykso\.github\.io/myks/?$ file://'"$PWD"'/docs/site.yaml'
            --remap '^https://mykso\.github\.io/myks/([^#]*?)/?(#.*)?$ file://'"$PWD"'/docs/src/content/docs/$1.md'
            --remap '^https://github\.com/mykso/myks/(blob|tree)/main/([^#]*)(#.*)?$ file://'"$PWD"'/$2'
            'docs/**/*.md' README.md CONTRIBUTING.md

      - name: Save lychee cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .lycheecache
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
