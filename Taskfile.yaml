# https://taskfile.dev
---
version: "3"

silent: true

vars:
  BIN_NAME: "myks"

tasks:
  default: ${GOTASK_BIN:-task} --list

  go:fmt:
    desc: Format the code
    cmds:
      - goimports-reviser -rm-unused -set-alias -format ./...
      - gofumpt -w .

  go:lint:
    desc: Lint the code
    cmds:
      - golangci-lint run

  go:build:
    desc: Build the binary
    cmds:
      - mkdir -p bin
      - goreleaser build --snapshot --clean --single-target --output
        bin/{{.BIN_NAME}}

  go:test:
    desc: Test the code
    deps:
      - go:build
    cmds:
      - |
        export PATH="{{.ROOT_DIR}}/bin:$PATH"
        go test -failfast -race ./... {{.CLI_ARGS}}

  docs:refgen:
    desc: Regenerate the CLI reference pages in the docs
    dir: docs
    cmds:
      # Same build as reference.cli in docs/site.yaml, which the docs CI check uses.
      - go build -o ../bin/{{.BIN_NAME}} ..
      - npm ci
      - npx --no-install help2md --bin ../bin/{{.BIN_NAME}} --out src/content/docs/reference/cli
